name: Morning scanner

on:
  schedule:
    - cron: '55 3 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python scan.py > scan-output.txt
          if grep -qx 'NO_SIGNALS' scan-output.txt; then
            curl --fail --silent --show-error --output /dev/null \
              --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode 'text=No trades at 09:25 IST'
          else
            while IFS= read -r signal; do
              [ -n "$signal" ] || continue
              curl --fail --silent --show-error --output /dev/null \
                --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${signal}"
            done < scan-output.txt
          fi
