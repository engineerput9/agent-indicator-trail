name: Morning scanner

# 09:26 version. One scan per weekday on the 09:20 bar (closes 09:25 IST);
# entry is that bar's close. GitHub crons are often late or skipped, so
# watchdog.yml retries until one success lands. A run that starts before
# 09:25 IST (early wake or manual) sends nothing at all, not even 'No trades',
# and does not count; only a success that started at or after 09:29 IST skips
# later runs, so the same day is not sent twice.
#
# FYERS is primary (since 13 Oct 2026): a scanner on the owner's box runs the same
# 09:20 rule A on Fyers data at 09:25 IST, sends Telegram itself and then sets
# the repo variable LAST_FYERS_SEND_DATE to today's IST date. This Yahoo job is
# the fallback: only runs that start at or after 09:29 IST may send, and they
# skip if that variable equals today's date. If the box did not send, Yahoo sends.
on:
  schedule:
    - cron: "30 3 * * 1-5"   # 09:00 IST wake (sends nothing)
    - cron: "45 3 * * 1-5"   # 09:15 IST wake (sends nothing)
    - cron: "59 3 * * 1-5"   # 09:29 IST Yahoo fallback (sends only if the Fyers box did not)
    - cron: "5 4 * * 1-5"    # 09:35 IST backup
    - cron: "15 4 * * 1-5"   # 09:45 IST backup
  workflow_dispatch:
    inputs:
      force:
        description: "Send again even if today's scan already succeeded (still never before 09:25 IST)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-indicator-trail
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if before 09:25 IST or today's scan already succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          FYERS_VAR_AT_START: ${{ vars.LAST_FYERS_SEND_DATE }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, subprocess
          from datetime import datetime, time, timedelta, timezone
          IST = timezone(timedelta(hours=5, minutes=30))
          repo = os.environ["GITHUB_REPOSITORY"]
          own_id = int(os.environ["GITHUB_RUN_ID"])
          def ist(stamp):
              return datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(IST)
          now = datetime.now(IST)
          own = json.loads(subprocess.check_output(
              ["gh", "run", "view", str(own_id), "--repo", repo, "--json", "startedAt"], text=True))
          started = ist(own["startedAt"]) if own.get("startedAt") else now
          today = now.date()
          cutoff = datetime.combine(today, time(9, 25), IST)
          env = open(os.environ["GITHUB_ENV"], "a")
          # The run's own start time decides 'early', the same field used for dedupe below.
          if started < cutoff or now < cutoff:
              print(f"run started {started:%Y-%m-%d %H:%M:%S} IST, now {now:%H:%M:%S} IST: before 09:25 the 09:20 bar is not closed, nothing will be sent")
              env.write("SKIP=1\n")
              raise SystemExit(0)
          if os.environ.get("FORCE") == "true":
              print("force run")
              env.write("SKIP=0\n")
              raise SystemExit(0)
          # Fyers on the box goes first (it never starts sending after 09:27:30 IST and then sets the
          # repo variable). GITHUB_TOKEN cannot read variables through the API (HTTP 403), so this job
          # relies on the vars context, which is only fresh for runs that start at or after 09:29 IST.
          handoff = datetime.combine(today, time(9, 29), IST)
          if started < handoff:
              print(f"run started {started:%H:%M:%S} IST, before the 09:29 Fyers hand-off: nothing sent; the 09:35/09:45 backups and the watchdog retry")
              env.write("SKIP=1\n")
              raise SystemExit(0)
          fy = os.environ.get("FYERS_VAR_AT_START", "")
          print(f"LAST_FYERS_SEND_DATE={fy!r}, today {today.isoformat()}")
          try:
              import base64
              raw_st = subprocess.check_output(["gh", "api", f"repos/{repo}/contents/state/last_send.json", "--jq", ".content"], text=True)
              st = json.loads(base64.b64decode(raw_st)).get("date")
          except Exception:
              st = None
          print(f"state/last_send.json date={st!r}")
          if st == today.isoformat():
              print("GitHub Fyers scanner already sent today's signals: Yahoo fallback sends nothing")
              env.write("SKIP=1\n")
              raise SystemExit(0)
          if fy == today.isoformat():
              print("Fyers (box) already sent today's signals: Yahoo fallback sends nothing")
              env.write("SKIP=1\n")
              raise SystemExit(0)
          raw = subprocess.check_output([
              "gh", "run", "list", "--repo", repo,
              "--workflow", "morning.yml",
              "--status", "success",
              "--limit", "30",
              "--json", "startedAt,createdAt,conclusion,databaseId,event",
          ], text=True)
          done = []
          for run in json.loads(raw):
              if run.get("conclusion") != "success" or run["databaseId"] == own_id:
                  continue
              stamp = ist(run.get("startedAt") or run["createdAt"])
              if stamp.date() == today and stamp >= handoff:
                  done.append(run["databaseId"])
          print(f"successes that started at or after 09:29 IST today: {done}")
          env.write("SKIP=1\n" if done else "SKIP=0\n")
          PY

      - name: Check out repository
        if: env.SKIP != '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: env.SKIP != '1'
        run: python -m pip install -r requirements.txt

      - name: Scan and notify Telegram
        if: env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          set -euo pipefail
          python scan.py | tee scan-output.txt
          python notify.py scan-output.txt
