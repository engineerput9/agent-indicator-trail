name: Morning scanner

# 09:26 version. One scan per weekday on the 09:20 bar (closes 09:25 IST);
# entry is that bar's close. GitHub crons are often late or skipped, so
# watchdog.yml retries until one success lands. A run that starts before
# 09:25 IST (early wake or manual) sends nothing at all, not even 'No trades',
# and does not count; only a success that started at or after 09:25 IST skips
# later runs, so the same day is not sent twice.
#
# FYERS is primary (since 13 Oct 2026): a scanner on the owner's box runs the same
# 09:20 rule A on Fyers data at 09:25 IST, sends Telegram itself and then sets
# the repo variable LAST_FYERS_SEND_DATE to today's IST date. This Yahoo job is
# the fallback: it waits until 09:29 IST, and skips sending if that variable
# equals today's date. If the box did not send (variable not set), Yahoo sends.
on:
  schedule:
    - cron: "30 3 * * 1-5"   # 09:00 IST wake (sends nothing)
    - cron: "45 3 * * 1-5"   # 09:15 IST wake (sends nothing)
    - cron: "56 3 * * 1-5"   # 09:26 IST scan
    - cron: "5 4 * * 1-5"    # 09:35 IST backup
    - cron: "15 4 * * 1-5"   # 09:45 IST backup
  workflow_dispatch:
    inputs:
      force:
        description: "Send again even if today's scan already succeeded (still never before 09:25 IST)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-indicator-trail
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if before 09:25 IST or today's scan already succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          FYERS_VAR_AT_START: ${{ vars.LAST_FYERS_SEND_DATE }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, subprocess, time as clock
          from datetime import datetime, time, timedelta, timezone
          IST = timezone(timedelta(hours=5, minutes=30))
          repo = os.environ["GITHUB_REPOSITORY"]
          own_id = int(os.environ["GITHUB_RUN_ID"])
          def ist(stamp):
              return datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(IST)
          now = datetime.now(IST)
          own = json.loads(subprocess.check_output(
              ["gh", "run", "view", str(own_id), "--repo", repo, "--json", "startedAt"], text=True))
          started = ist(own["startedAt"]) if own.get("startedAt") else now
          today = now.date()
          cutoff = datetime.combine(today, time(9, 25), IST)
          env = open(os.environ["GITHUB_ENV"], "a")
          def fyers_sent_date():
              # Live value via the API; fall back to the vars context captured at job start.
              try:
                  out = subprocess.run(["gh", "api", f"repos/{repo}/actions/variables/LAST_FYERS_SEND_DATE"],
                                       capture_output=True, text=True, timeout=60)
                  if out.returncode == 0:
                      return json.loads(out.stdout).get("value", ""), "API"
                  print(f"variable API read failed ({out.stderr.strip()[:120]})")
              except Exception as exc:
                  print(f"variable API read failed ({type(exc).__name__})")
              return os.environ.get("FYERS_VAR_AT_START", ""), "vars context at job start"
          print("LAST_FYERS_SEND_DATE now: %r (%s)" % fyers_sent_date())
          # The run's own start time decides 'early', the same field used for dedupe below.
          if started < cutoff or now < cutoff:
              print(f"run started {started:%Y-%m-%d %H:%M:%S} IST, now {now:%H:%M:%S} IST: before 09:25 the 09:20 bar is not closed, nothing will be sent")
              env.write("SKIP=1\n")
              raise SystemExit(0)
          if os.environ.get("FORCE") == "true":
              print("force run")
              env.write("SKIP=0\n")
              raise SystemExit(0)
          # Fyers on the box goes first (sends from 09:25, never after 09:28). Give it until 09:29 IST.
          check_at = datetime.combine(today, time(9, 29), IST)
          if datetime.now(IST) < check_at:
              wait = (check_at - datetime.now(IST)).total_seconds()
              print(f"waiting {wait:.0f}s until 09:29 IST so the Fyers box scan can send first")
              clock.sleep(wait)
          fy, src = fyers_sent_date()
          print(f"LAST_FYERS_SEND_DATE={fy!r} ({src}), today {today.isoformat()}")
          if fy == today.isoformat():
              print("Fyers (box) already sent today's signals: Yahoo fallback sends nothing")
              env.write("SKIP=1\n")
              raise SystemExit(0)
          raw = subprocess.check_output([
              "gh", "run", "list", "--repo", repo,
              "--workflow", "morning.yml",
              "--status", "success",
              "--limit", "30",
              "--json", "startedAt,createdAt,conclusion,databaseId,event",
          ], text=True)
          done = []
          for run in json.loads(raw):
              if run.get("conclusion") != "success" or run["databaseId"] == own_id:
                  continue
              stamp = ist(run.get("startedAt") or run["createdAt"])
              if stamp.date() == today and stamp >= cutoff:
                  done.append(run["databaseId"])
          print(f"successes that started at or after 09:25 IST today: {done}")
          env.write("SKIP=1\n" if done else "SKIP=0\n")
          PY

      - name: Check out repository
        if: env.SKIP != '1'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: env.SKIP != '1'
        run: python -m pip install -r requirements.txt

      - name: Scan and notify Telegram
        if: env.SKIP != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_2: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          set -euo pipefail
          python scan.py | tee scan-output.txt
          python notify.py scan-output.txt
