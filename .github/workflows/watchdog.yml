name: Morning scanner watchdog

# The 09:29 IST fallback cron is best-effort. From 09:30 to 11:30 IST, start the morning
# scan if no success has landed that started at or after 09:29 IST. An earlier
# wake does not count. The scan job itself skips a second success. If the Fyers
# box scanner already sent today (repo variable LAST_FYERS_SEND_DATE == today),
# nothing is dispatched.
on:
  schedule:
    - cron: "*/5 3-5 * * 1-5"   # 08:30–11:25 IST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch morning scan if today's 09:29 run is missing
        env:
          GH_TOKEN: ${{ github.token }}
          FYERS_VAR_AT_START: ${{ vars.LAST_FYERS_SEND_DATE }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, subprocess, urllib.request
          from datetime import datetime, time, timedelta, timezone
          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          mins = now.hour * 60 + now.minute
          if now.weekday() >= 5 or mins < 9 * 60 + 30 or mins > 11 * 60 + 30:
              print(f"{now:%H:%M} IST outside 09:30-11:30 retry window")
              raise SystemExit(0)
          cutoff = datetime.combine(now.date(), time(9, 29), IST)  # earlier runs are hand-off skips, not sends
          # Fyers on the box is primary: if it sent today, there is nothing to retry.
          fyv = os.environ.get("FYERS_VAR_AT_START", "")  # vars context; fresh because this runs after 09:30
          if fyv == now.date().isoformat():
              print("Fyers (box) sent today's signals: no Yahoo retry needed")
              raise SystemExit(0)
          raw = subprocess.check_output([
              "gh", "run", "list",
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--workflow", "morning.yml",
              "--limit", "20",
              "--json", "createdAt,startedAt,conclusion,status",
          ], text=True)
          for run in json.loads(raw):
              stamp = datetime.fromisoformat((run.get("startedAt") or run["createdAt"]).replace("Z", "+00:00")).astimezone(IST)
              if stamp.date() != now.date():
                  continue
              if run.get("status") in ("queued", "in_progress", "waiting", "requested", "pending"):
                  print("morning scan already active")
                  raise SystemExit(0)
              if run.get("conclusion") == "success" and stamp >= cutoff:
                  print("morning scan already succeeded (started at or after 09:29 IST)")
                  raise SystemExit(0)
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          body = json.dumps({"ref": os.environ.get("GITHUB_REF_NAME", "master")}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/morning.yml/dispatches",
              data=body,
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("dispatch", resp.status)
          PY
